name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    # macOS arm64 is the target. Linux proves the pure logic imports without macOS.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Show the runner and require arm64 on macOS
        run: |
          echo "${{ matrix.os }}: $RUNNER_OS $RUNNER_ARCH, uname -m = $(uname -m)"
          if [ "$RUNNER_OS" = "macOS" ] && [ "$(uname -m)" != "arm64" ]; then
            echo "macOS runner is not arm64" >&2
            exit 1
          fi

      - name: Run project checks
        run: bash scripts/check.sh

  pr-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Block PRs opened from main
        run: |
          if [ "${{ github.head_ref }}" = "main" ] || [ "${{ github.head_ref }}" = "master" ]; then
            echo "Open PRs from a task branch, not main." >&2
            exit 1
          fi
